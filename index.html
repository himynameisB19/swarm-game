<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Swarm</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0a0e1d;
    touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Trebuchet MS", system-ui, sans-serif; color: #fff;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .ui { position: absolute; inset: 0; pointer-events: none; }
  #app { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); overflow: hidden; background: #0a0e1d; box-shadow: 0 0 60px rgba(0,0,0,.6); }
  #pausebtn { position: absolute; top: 54px; right: 12px; margin-top: env(safe-area-inset-top); width: 44px; height: 44px; border-radius: 50%; background: rgba(10,14,29,.65); display: flex; align-items: center; justify-content: center; font-size: 20px; pointer-events: auto; cursor: pointer; }
  #xpbar { position: absolute; top: 0; left: 0; right: 0; height: 10px; background: rgba(255,255,255,.12); }
  #xpfill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4de1ff, #6cff8f); transition: width .12s; }
  #lvl { position: absolute; top: 16px; left: 12px; padding: 3px 12px; border-radius: 999px; background: rgba(10,14,29,.65); font-weight: 800; font-size: 15px; margin-top: env(safe-area-inset-top); }
  #time { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 900; text-shadow: 0 3px 0 rgba(0,0,0,.4); margin-top: env(safe-area-inset-top); }
  #kills { position: absolute; top: 16px; right: 12px; padding: 3px 12px; border-radius: 999px; background: rgba(10,14,29,.65); font-weight: 800; font-size: 15px; margin-top: env(safe-area-inset-top); }
  #banner { position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-size: min(11vw, 52px); font-weight: 900; text-shadow: 0 4px 0 rgba(0,0,0,.5); opacity: 0; }
  #banner.show { animation: ban 2s ease-out; }
  @keyframes ban { 0% { opacity: 0; transform: scale(.6); } 12% { opacity: 1; transform: scale(1.08); } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  .panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-sizing: border-box; width: min(84%, 320px); max-height: 88%; overflow-y: auto; padding: 16px 14px 14px; text-align: center;
    background: rgba(8,11,26,.86); backdrop-filter: blur(10px); border-radius: 26px;
    border: 1px solid rgba(120,160,255,.25);
  }
  .panel.live { pointer-events: auto; }
  .big { font-size: 46px; font-weight: 900; line-height: 1.05; }
  .sub { margin-top: 8px; font-size: 17px; opacity: .85; line-height: 1.4; }
  .btn { margin-top: 18px; padding: 14px 0; border-radius: 16px; font-weight: 900; font-size: 20px; color: #0a0e1d; background: #ffd23f; }
  #title .btn { animation: pulse 1.1s ease-in-out infinite; }
  #again { pointer-events: auto; cursor: pointer; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 8px; padding: 11px 12px; box-sizing: border-box;
    border-radius: 16px; border: 2px solid rgba(120,160,255,.35); background: rgba(40,52,100,.55);
    color: #fff; font: inherit; text-align: left; cursor: pointer;
  }
  .opt.pick { border-color: #ffd23f; background: rgba(255,210,63,.22); }
  .opt .ic { font-size: 24px; }
  .opt .tx { flex: 1; display: flex; flex-direction: column; }
  .opt b { font-size: 15px; }
  .opt small { opacity: .8; font-size: 12px; }
  .opt .lv { font-size: 11px; font-weight: 800; color: #6cff8f; white-space: nowrap; }
  .shopbtn { composes: opt; }
  #shop .opt.dis { opacity: .4; }
  .gold { margin-top: 10px; font-size: 18px; font-weight: 800; color: #ffd23f; }
  #rotate { position: fixed; inset: 0; z-index: 99; display: none; align-items: center; justify-content: center; text-align: center; background: #0a0e1d; font-size: 24px; font-weight: 800; padding: 30px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  @media (orientation: landscape) {
    #lu { width: min(88%, 600px); }
    #opts, #shop { display: flex; gap: 8px; }
    #opts .opt, #shop .opt { flex: 1; flex-direction: column; text-align: center; justify-content: center; gap: 4px; }
    #over .big { font-size: 34px; }
    #over .sub { margin-top: 4px; font-size: 15px; }
    #over .gold { margin-top: 4px; font-size: 16px; }
    #over .btn { margin-top: 12px; padding: 11px 0; }
  }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #title .btn { animation: none; } }
</style>
</head>
<body>
<div id="rotate">Rotate your phone to play ↻</div>
<div id="app"><canvas id="c"></canvas>
<div class="ui">
  <div id="pausebtn">⏸</div>
  <div id="xpbar"><i id="xpfill"></i></div>
  <div id="lvl">Lv 1</div>
  <div id="time">0:00</div>
  <div id="kills">💀 0</div>
  <div id="banner"></div>

  <div id="title" class="panel">
    <div class="big">Swarm</div>
    <div class="sub">Use the joystick to move. Your weapon fires automatically. Pick a new power every level and see how long you can survive.</div>
    <div class="btn">Tap to start</div>
    <div class="sub" id="hint" style="font-size:14px;opacity:.65">For fullscreen, choose “Add to Home Screen” in your browser menu.</div>
  </div>

  <div id="lu" class="panel live hidden">
    <div class="big" style="font-size:26px">Level up!</div>
    <div id="opts"></div>
  </div>

  <div id="pause" class="panel live hidden"><div class="big">Paused</div><div class="btn" id="resume" style="cursor:pointer">Resume</div></div>
  <div id="over" class="panel live hidden">
    <div class="big" id="oT"></div>
    <div class="sub" id="oS"></div>
    <div class="gold" id="oG"></div>
    <div id="shop"></div>
    <div class="btn" id="again">Play again</div>
  </div>
</div></div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const xpFill = $('xpfill'), lvlEl = $('lvl'), timeEl = $('time'), killsEl = $('kills'), bannerEl = $('banner');
  const titleEl = $('title'), luEl = $('lu'), optsEl = $('opts'), overEl = $('over');
  const oT = $('oT'), oS = $('oS'), oG = $('oG'), shopEl = $('shop');

  // ?demo ile açarsan oyun kendi kendine oynar (reels için ekran kaydı)
  const DEMO = /[?&](demo|reels)(=|&|$)/.test(location.search);

  let W, H, dpr, vig, offX = 0;
  const appEl = $('app');
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.min(innerWidth, Math.round(innerHeight * 2.2)); H = innerHeight;
    appEl.style.width = W + 'px'; offX = (innerWidth - W) / 2;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.6);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,.55)');
  }
  addEventListener('resize', resize); resize();

  const R = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ---------- Kalıcı gelişim ----------
  let meta = { gold: 0, hp: 0, dmg: 0, spd: 0, best: 0 };
  try { Object.assign(meta, JSON.parse(localStorage.getItem('suru-meta') || '{}')); } catch (e) {}
  const saveMeta = () => { try { localStorage.setItem('suru-meta', JSON.stringify(meta)); } catch (e) {} };
  const SHOP = [
    { k: 'hp', n: 'Max HP +20', ic: '❤️', base: 40 },
    { k: 'dmg', n: 'Damage +10%', ic: '💥', base: 60 },
    { k: 'spd', n: 'Speed +5%', ic: '👟', base: 50 }
  ];
  const shopCost = s => Math.round(s.base * Math.pow(1.6, meta[s.k]));

  // ---------- Ses ----------
  let ac, lastSnd = {};
  function tone(freq, dur = 0.1, type = 'sine', vol = 0.1, slideTo, key, gap = 0) {
    const now = performance.now();
    if (key) { if (now - (lastSnd[key] || 0) < gap) return; lastSnd[key] = now; }
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur);
    } catch (e) {}
  }
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];

  // ---------- Güçlendirmeler ----------
  const UPS = [
    { k: 'fire',   n: 'Rapid fire',      d: 'Fire rate +22%',               max: 6, ic: '🔫' },
    { k: 'multi',  n: 'Multishot',      d: '+1 projectile per shot',          max: 5, ic: '🔱' },
    { k: 'dmg',    n: 'Heavy rounds',     d: 'Damage +30%',                   max: 6, ic: '💥' },
    { k: 'pierce', n: 'Piercing shots',    d: 'Pierces +1 enemy',       max: 4, ic: '🏹' },
    { k: 'blades', n: 'Spinning blades',  d: 'Blades orbit around you',     max: 5, ic: '🌀' },
    { k: 'light',  n: 'Lightning',          d: 'Strikes random enemies', max: 5, ic: '⚡' },
    { k: 'magnet', n: 'Magnet',        d: 'Wider pickup range',       max: 4, ic: '🧲' },
    { k: 'speed',  n: 'Agility',        d: 'Move speed +8%',             max: 4, ic: '👟' },
    { k: 'hp',     n: 'Heal',      d: 'Refill HP, max HP +20',     max: 5, ic: '💖' }
  ];
  const up = { fire: 0, multi: 0, dmg: 0, pierce: 0, blades: 0, light: 0, magnet: 0, speed: 0, hp: 0 };

  const dmgStat = () => (1 + 0.3 * up.dmg) * (1 + 0.1 * meta.dmg);
  const fireRate = () => 2.4 * (1 + 0.22 * up.fire);
  const speedStat = () => 190 * (1 + 0.08 * up.speed) * (1 + 0.05 * meta.spd);
  const magnetR = () => 75 + 35 * up.magnet;
  const needFor = l => Math.floor(5 + l * 3 + l * l * 0.5);

  // ---------- Düşman tipleri ----------
  const ET = {
    bat:   { r: 9,  hp: 1,   sp: 100, dmg: 7,  xp: 1,  col: '#ff5d73' },
    grunt: { r: 14, hp: 4,   sp: 72,  dmg: 11, xp: 2,  col: '#ffb703' },
    tank:  { r: 24, hp: 16,  sp: 46,  dmg: 18, xp: 6,  col: '#b57bff' },
    boss:  { r: 52, hp: 260, sp: 52,  dmg: 28, xp: 40, col: '#ff3d81' }
  };
  const MAXE = 260;

  // ---------- Durum ----------
  const player = { x: 0, y: 0, vx: 0, vy: 0, hp: 100, maxHp: 100, inv: 0 };
  let enemies = [], bullets = [], gems = [], parts = [], bolts = [];
  let state = 'ready';            // ready | play | levelup | over
  let t = 0, kills = 0, level = 1, xp = 0, need = 8;
  let fireT = 0, lightT = 1.5, bladeA = 0, spawnAcc = 0, nextBoss = 60, nextSwarm = 22, bossN = 0;
  let cx = 0, cy = 0, shake = 0, flash = 0, streak = 0, lastPick = 0, eid = 0, lastSec = -1;
  let opts = [];

  function reset() {
    enemies = []; bullets = []; gems = []; parts = []; bolts = [];
    for (const k in up) up[k] = 0;
    player.x = player.y = player.vx = player.vy = 0;
    player.maxHp = 100 + meta.hp * 20; player.hp = player.maxHp; player.inv = 0;
    t = 0; kills = 0; level = 1; xp = 0; need = needFor(1);
    fireT = 0; lightT = 1.5; bladeA = 0; spawnAcc = 0; nextBoss = 60; nextSwarm = 22; bossN = 0;
    shake = 0; flash = 0; streak = 0; cx = 0; cy = 0; lastSec = -1;
    luEl.classList.add('hidden'); overEl.classList.add('hidden');
  }

  function start() {
    reset(); state = 'play'; titleEl.classList.add('hidden');
    tone(1, 0.01, 'sine', 0.0001); wakeLock();
    try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
  }

  // ---------- Mobil ----------
  const pauseEl = $('pause');
  function pause() { if (state !== 'play') return; state = 'paused'; joy.id = null; pauseEl.classList.remove('hidden'); }
  function resume() { if (state !== 'paused') return; state = 'play'; pauseEl.classList.add('hidden'); }
  $('pausebtn').addEventListener('click', pause);
  matchMedia('(orientation: portrait) and (pointer: coarse)').addEventListener('change', ev => { if (ev.matches) pause(); });
  $('resume').addEventListener('click', resume);
  document.addEventListener('visibilitychange', () => { if (document.hidden && !DEMO) pause(); else wakeLock(); });
  let wl = null;
  async function wakeLock() {
    try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {}
  }
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone || !('ontouchstart' in window)) $('hint').classList.add('hidden');
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

  // ---------- Girdi ----------
  const joy = { id: null, ox: 0, oy: 0, px: 0, py: 0 };
  function joyBase() { const r = Math.max(48, Math.min(66, H * 0.17)); return { x: W - r - 56, y: H - r - 30, r }; }
  const keys = {};
  addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('#pausebtn')) return;
    if (state === 'ready') { e.preventDefault(); start(); }
    if (state !== 'play') return;
    e.preventDefault();
    const b = joyBase(), px = e.clientX - offX;
    if (joy.id === null && Math.hypot(px - b.x, e.clientY - b.y) < b.r * 2.1) { joy.id = e.pointerId; joy.px = px; joy.py = e.clientY; }
  }, { passive: false });
  addEventListener('pointermove', e => {
    if (e.pointerId !== joy.id) return;
    joy.px = e.clientX - offX; joy.py = e.clientY;
  });
  const upEv = e => { if (e.pointerId === joy.id) joy.id = null; };
  addEventListener('pointerup', upEv); addEventListener('pointercancel', upEv);
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => { keys[e.code] = true; if (state === 'ready' && e.code === 'Space') start(); });
  addEventListener('keyup', e => { keys[e.code] = false; });

  function inputVec() {
    if (joy.id !== null) {
      const b = joyBase(), dx = joy.px - b.x, dy = joy.py - b.y, d = Math.hypot(dx, dy);
      if (d > 6) { const m = Math.min(d, b.r) / b.r; return [dx / d * m, dy / d * m]; }
      return [0, 0];
    }
    const ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    const iy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    const l = Math.hypot(ix, iy); return l ? [ix / l, iy / l] : [0, 0];
  }

  // demo modu: düşmandan kaç, mücevhere git
  function autoVec() {
    let vx = 0, vy = 0;
    for (const e of enemies) {
      const dx = player.x - e.x, dy = player.y - e.y, d2 = dx * dx + dy * dy;
      if (d2 < 280 * 280) { const d = Math.sqrt(d2) + 1, w = (280 - d) / 280; vx += dx / d * w * w * 3; vy += dy / d * w * w * 3; }
    }
    let bd = 1e12, bg = null;
    for (const g of gems) { const dx = g.x - player.x, dy = g.y - player.y, d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; bg = g; } }
    if (bg && bd < 420 * 420) { const d = Math.sqrt(bd) + 1; vx += (bg.x - player.x) / d; vy += (bg.y - player.y) / d; }
    vx += Math.cos(t * 0.5) * 0.3; vy += Math.sin(t * 0.5) * 0.3;
    const l = Math.hypot(vx, vy);
    return l > 0.01 ? [vx / l * Math.min(1, l), vy / l * Math.min(1, l)] : [0, 0];
  }

  // ---------- Efektler ----------
  function burst(x, y, col, n, sp) {
    for (let i = 0; i < n && parts.length < 450; i++) {
      const a = R(0, 6.283), v = R(0.3, 1) * sp;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(0.25, 0.6), col, s: R(2, 4.5) });
    }
  }
  function banner(txt, col) {
    bannerEl.textContent = txt; bannerEl.style.color = col || '#fff';
    bannerEl.classList.remove('show'); void bannerEl.offsetWidth; bannerEl.classList.add('show');
  }
  const glowCache = {};
  function glow(col) {
    if (glowCache[col]) return glowCache[col];
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, col); gr.addColorStop(0.35, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return (glowCache[col] = c);
  }

  // ---------- Düşmanlar ----------
  function spawnEnemy(type, x, y) {
    const d = ET[type], hs = 1 + t / 80;
    const hp = d.hp * hs * (type === 'boss' ? 1 + bossN * 0.9 : 1);
    enemies.push({ id: eid++, type, x, y, r: d.r, hp, max: hp, sp: d.sp * R(0.9, 1.1), hit: 0, bladeT: 0, dead: false });
  }
  const edgeDist = () => Math.hypot(W, H) / 2 + 50;
  function spawnEdge(type) {
    const a = R(0, 6.283), d = edgeDist();
    spawnEnemy(type, player.x + Math.cos(a) * d, player.y + Math.sin(a) * d);
  }
  function spawnRing(n) {
    const d = edgeDist() + 30;
    for (let i = 0; i < n; i++) {
      const a = i / n * 6.283;
      spawnEnemy('bat', player.x + Math.cos(a) * d, player.y + Math.sin(a) * d);
    }
  }
  function chooseType() {
    const r = Math.random();
    if (t < 20) return 'bat';
    if (t < 60) return r < 0.7 ? 'bat' : 'grunt';
    if (t < 150) return r < 0.45 ? 'bat' : r < 0.85 ? 'grunt' : 'tank';
    return r < 0.3 ? 'bat' : r < 0.7 ? 'grunt' : 'tank';
  }

  function hitEnemy(e, dmg) {
    if (e.dead) return;
    e.hp -= dmg; e.hit = 0.08;
    if (e.hp <= 0) kill(e);
  }
  function kill(e) {
    e.dead = true; kills++;
    const d = ET[e.type];
    gems.push({ x: e.x, y: e.y, v: d.xp, fly: false });
    if (e.type === 'boss') {
      for (let i = 0; i < 16; i++) { const a = R(0, 6.283), r = R(20, 70); gems.push({ x: e.x + Math.cos(a) * r, y: e.y + Math.sin(a) * r, v: 6, fly: false }); }
      gems.push({ x: e.x, y: e.y, v: 0, heart: 40, fly: false });
      burst(e.x, e.y, d.col, 40, 260); shake = 14; banner('Boss defeated!', '#ffd23f');
      tone(220, 0.6, 'triangle', 0.25, 880); buzz(60);
    } else {
      if (Math.random() < 0.025) gems.push({ x: e.x + 8, y: e.y, v: 0, heart: 18, fly: false });
      burst(e.x, e.y, d.col, e.type === 'tank' ? 14 : 6, 150);
      tone(e.type === 'bat' ? 260 : 180, 0.07, 'square', 0.05, 90, 'kill', 40);
    }
    if (gems.length > 300) { const g0 = gems.shift(); if (!g0.heart) xp += g0.v; }
  }

  // ---------- Seviye atlama ----------
  function showLevelUp() {
    state = 'levelup'; joy.id = null;
    let pool = UPS.filter(u => up[u.k] < u.max);
    if (level === 2) pool = pool.filter(u => ['multi', 'blades', 'light', 'fire'].includes(u.k));
    pool.sort(() => Math.random() - 0.5);
    opts = pool.slice(0, 3);
    if (!opts.length) { player.hp = player.maxHp; state = 'play'; return; }
    optsEl.innerHTML = opts.map((u, i) =>
      `<button class="opt" data-i="${i}"><span class="ic">${u.ic}</span><span class="tx"><b>${u.n}</b><small>${u.d}</small></span>` +
      `<span class="lv">${up[u.k] === 0 ? 'New!' : 'Lv ' + up[u.k] + ' → ' + (up[u.k] + 1)}</span></button>`).join('');
    luEl.classList.remove('hidden');
    [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.14), i * 70));
    buzz(25);
    if (DEMO) {
      const i = Math.floor(Math.random() * opts.length);
      setTimeout(() => { const b = optsEl.children[i]; if (b) b.classList.add('pick'); }, 500);
      setTimeout(() => choose(i), 1100);
    }
  }
  function choose(i) {
    if (state !== 'levelup' || !opts[i]) return;
    const k = opts[i].k; up[k]++;
    if (k === 'hp') { player.maxHp += 20; player.hp = player.maxHp; }
    luEl.classList.add('hidden'); state = 'play';
    tone(880, 0.15, 'sine', 0.12);
  }
  optsEl.addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) choose(+b.dataset.i); });

  // ---------- Bitiş ----------
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function endRun() {
    state = 'over'; joy.id = null;
    tone(150, 0.7, 'sawtooth', 0.2, 40); buzz(100);
    const gold = Math.floor(kills * 0.6 + t * 0.4);
    meta.gold += gold;
    const newBest = t > meta.best; if (newBest) meta.best = t;
    saveMeta();
    oT.textContent = fmt(t);
    oS.innerHTML = `Level ${level} · ${kills} kills<br>${newBest ? 'New record!' : 'Best: ' + fmt(meta.best)}`;
    renderShop(gold);
    setTimeout(() => overEl.classList.remove('hidden'), 500);
    if (DEMO) setTimeout(start, 2600);
  }
  function renderShop(gold) {
    if (gold !== undefined) oG.textContent = `+${gold} gold · Total: ${meta.gold} 🪙`;
    else oG.textContent = `Total: ${meta.gold} 🪙`;
    shopEl.innerHTML = SHOP.map(s => {
      const c = shopCost(s);
      return `<button class="opt ${meta.gold < c ? 'dis' : ''}" data-k="${s.k}"><span class="ic">${s.ic}</span><span class="tx"><b>${s.n}</b><small>Level ${meta[s.k]}</small></span><span class="lv" style="color:#ffd23f">${c} 🪙</span></button>`;
    }).join('');
  }
  shopEl.addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b) return;
    const s = SHOP.find(x => x.k === b.dataset.k), c = shopCost(s);
    if (meta.gold >= c) { meta.gold -= c; meta[s.k]++; saveMeta(); tone(880, 0.12, 'sine', 0.12); renderShop(); }
  });
  $('again').addEventListener('click', start);

  // ---------- Güncelleme ----------
  function update(dt) {
    t += dt;

    // hareket
    const [ix, iy] = DEMO ? autoVec() : inputVec();
    const sp = speedStat(), a = 1 - Math.pow(0.0005, dt);
    player.vx += (ix * sp - player.vx) * a; player.vy += (iy * sp - player.vy) * a;
    player.x += player.vx * dt; player.y += player.vy * dt;
    player.inv = Math.max(0, player.inv - dt);
    player.hp = Math.min(player.maxHp, player.hp + 0.8 * dt);
    cx += (player.x - cx) * (1 - Math.pow(0.0001, dt)); cy += (player.y - cy) * (1 - Math.pow(0.0001, dt));

    // otomatik ateş
    fireT -= dt;
    if (fireT <= 0) {
      let tg = null, bd = 460 * 460;
      for (const e of enemies) { const dx = e.x - player.x, dy = e.y - player.y, d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; tg = e; } }
      if (tg) {
        const base = Math.atan2(tg.y - player.y, tg.x - player.x), n = 1 + up.multi;
        for (let i = 0; i < n && bullets.length < 160; i++) {
          const ang = base + (i - (n - 1) / 2) * 0.17;
          bullets.push({ x: player.x, y: player.y, vx: Math.cos(ang) * 560, vy: Math.sin(ang) * 560, dmg: dmgStat() * 1.2, pierce: up.pierce, life: 1.1, hits: [], dead: false });
        }
        fireT = 1 / fireRate();
      } else fireT = 0.05;
    }

    // dönen bıçaklar
    bladeA += dt * 3.4;
    const nb = up.blades ? up.blades + 1 : 0, bpos = [];
    for (let i = 0; i < nb; i++) {
      const ang = bladeA + i / nb * 6.283, rad = 78 + up.blades * 4;
      bpos.push({ x: player.x + Math.cos(ang) * rad, y: player.y + Math.sin(ang) * rad });
    }
    bladePos = bpos;

    // şimşek
    if (up.light) {
      lightT -= dt;
      if (lightT <= 0) {
        lightT = Math.max(0.6, 2.6 - 0.35 * up.light);
        const cand = enemies.filter(e => !e.dead && Math.hypot(e.x - player.x, e.y - player.y) < 420);
        for (let i = 0; i < up.light + 1 && cand.length; i++) {
          const e = cand.splice(Math.floor(Math.random() * cand.length), 1)[0];
          const pts = []; let x = e.x + R(-50, 50), y = e.y - 420;
          for (let s = 0; s <= 7; s++) { pts.push([x + (s === 7 ? e.x - x : R(-24, 24)), y + (e.y - y) * s / 7]); }
          pts[7] = [e.x, e.y];
          bolts.push({ pts, t: 0.18 });
          for (const o of enemies) if (!o.dead && Math.hypot(o.x - e.x, o.y - e.y) < 55) hitEnemy(o, 8 * dmgStat());
          burst(e.x, e.y, '#bfe9ff', 10, 220);
          tone(90, 0.2, 'sawtooth', 0.14, 40, 'bolt', 60);
        }
      }
    }

    // düşman yönetmeni
    spawnAcc += dt * Math.min(14, 1.6 + t * 0.035);
    while (spawnAcc >= 1) { spawnAcc--; if (enemies.length < MAXE) spawnEdge(chooseType()); }
    if (t >= nextSwarm) { nextSwarm += 50; spawnRing(24 + Math.floor(t / 30)); banner('Swarm incoming!', '#ff8fa3'); tone(110, 0.5, 'sawtooth', 0.18, 60); shake = 6; }
    if (t >= nextBoss) { nextBoss += 75; bossN++; spawnEdge('boss'); banner('Boss incoming!', '#ff3d81'); tone(80, 0.8, 'sawtooth', 0.25, 40); buzz(80); shake = 10; }

    // düşmanlar
    const far = edgeDist() + 260;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) + 0.01;
      e.x += dx / d * e.sp * dt; e.y += dy / d * e.sp * dt;
      e.hit -= dt; e.bladeT -= dt;
      if (d > far && e.type !== 'boss') { const aa = R(0, 6.283), dd = edgeDist(); e.x = player.x + Math.cos(aa) * dd; e.y = player.y + Math.sin(aa) * dd; }
      if (d < e.r + 13 && player.inv <= 0) {
        const mul = Math.min(1, 0.5 + t / 60);
        player.hp -= ET[e.type].dmg * mul; player.inv = 0.55; flash = 0.35; shake = Math.max(shake, 7);
        tone(140, 0.15, 'square', 0.14, 70); buzz(25);
        burst(player.x, player.y, '#ffffff', 8, 180);
        if (player.hp <= 0) { player.hp = 0; endRun(); return; }
      }
      // bıçak çarpışması
      for (const b of bladePos) {
        if (e.bladeT <= 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 12) { hitEnemy(e, 2.4 * dmgStat()); e.bladeT = 0.28; }
      }
    }

    // mermiler
    for (const b of bullets) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) { b.dead = true; continue; }
      for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.x - b.x, dy = e.y - b.y, rr = e.r + 5;
        if (dx * dx + dy * dy < rr * rr && !b.hits.includes(e.id)) {
          b.hits.push(e.id); hitEnemy(e, b.dmg);
          if (b.pierce-- <= 0) { b.dead = true; break; }
        }
      }
    }
    enemies = enemies.filter(e => !e.dead);
    bullets = bullets.filter(b => !b.dead);

    // mücevherler
    const mr = magnetR();
    if (now() - lastPick > 600) streak = 0;
    for (let i = gems.length - 1; i >= 0; i--) {
      const g = gems[i], dx = player.x - g.x, dy = player.y - g.y, d = Math.hypot(dx, dy) + 0.01;
      if (d < mr) g.fly = true;
      if (g.fly) { const s = (320 + (mr - Math.min(d, mr)) * 2 + 200) * dt; g.x += dx / d * Math.min(s, d); g.y += dy / d * Math.min(s, d); }
      if (d < 16) {
        if (g.heart) { player.hp = Math.min(player.maxHp, player.hp + g.heart); tone(700, 0.2, 'sine', 0.12, 1100); }
        else { xp += g.v; streak++; lastPick = now(); tone(520 * Math.pow(2, SCALE[Math.min(streak, 10)] / 12), 0.06, 'sine', 0.07, undefined, 'gem', 35); }
        gems.splice(i, 1);
      }
    }

    // parçacıklar, şimşek
    for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.04, dt); p.vy *= Math.pow(0.04, dt); }
    parts = parts.filter(p => p.life > 0);
    for (const b of bolts) b.t -= dt;
    bolts = bolts.filter(b => b.t > 0);
    shake *= Math.pow(0.02, dt); flash = Math.max(0, flash - dt);

    // seviye
    if (xp >= need && state === 'play') { xp -= need; level++; need = needFor(level); showLevelUp(); }
  }
  let bladePos = [];
  const now = () => performance.now();

  // ---------- Çizim ----------
  const circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); };

  function drawEnemy(e) {
    const d = ET[e.type], ang = Math.atan2(player.y - e.y, player.x - e.x), r = e.r;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + r * 0.7, r * 0.9, r * 0.35, 0, 0, 6.2832); ctx.fill();
    if (e.type === 'boss') {
      ctx.fillStyle = e.hit > 0 ? '#fff' : '#c2185b';
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * 6.283 + t * 0.6;
        ctx.beginPath(); ctx.moveTo(e.x + Math.cos(a - 0.14) * r, e.y + Math.sin(a - 0.14) * r);
        ctx.lineTo(e.x + Math.cos(a) * r * 1.3, e.y + Math.sin(a) * r * 1.3);
        ctx.lineTo(e.x + Math.cos(a + 0.14) * r, e.y + Math.sin(a + 0.14) * r); ctx.fill();
      }
    }
    ctx.fillStyle = e.hit > 0 ? '#fff' : d.col; circle(e.x, e.y, r);
    if (e.type === 'tank') { ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(e.x, e.y, r - 2, 0, 6.2832); ctx.stroke(); }
    const ca = Math.cos(ang), sa = Math.sin(ang);
    for (const s of [-1, 1]) {
      const ex = e.x + ca * r * 0.35 - sa * r * 0.3 * s, ey = e.y + sa * r * 0.35 + ca * r * 0.3 * s;
      ctx.fillStyle = '#fff'; circle(ex, ey, r * 0.27);
      ctx.fillStyle = '#111'; circle(ex + ca * r * 0.1, ey + sa * r * 0.1, r * 0.13);
    }
    if (e.type === 'boss') {
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(e.x - 46, e.y - r - 22, 92, 8);
      ctx.fillStyle = '#ff3d81'; ctx.fillRect(e.x - 46, e.y - r - 22, 92 * Math.max(0, e.hp / e.max), 8);
    }
  }

  function draw() {
    ctx.fillStyle = '#0a0e1d'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    const sx = shake > 0.4 ? (Math.random() - 0.5) * shake : 0, sy = shake > 0.4 ? (Math.random() - 0.5) * shake : 0;
    ctx.translate(W / 2 - cx + sx, H / 2 - cy + sy);
    const L = cx - W / 2 - 60, Rr = cx + W / 2 + 60, T = cy - H / 2 - 60, B = cy + H / 2 + 60;

    // zemin ızgarası
    const gs = 90;
    ctx.strokeStyle = 'rgba(120,150,255,.09)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = Math.floor(L / gs) * gs; x < Rr; x += gs) { ctx.moveTo(x, T); ctx.lineTo(x, B); }
    for (let y = Math.floor(T / gs) * gs; y < B; y += gs) { ctx.moveTo(L, y); ctx.lineTo(Rr, y); }
    ctx.stroke();

    // mücevherler
    ctx.globalCompositeOperation = 'lighter';
    for (const g of gems) {
      if (g.x < L || g.x > Rr || g.y < T || g.y > B) continue;
      const col = g.heart ? '#ff6b9a' : g.v >= 6 ? '#ffd23f' : g.v >= 2 ? '#6cff8f' : '#4de1ff';
      const s = g.heart ? 34 : g.v >= 6 ? 30 : 22;
      ctx.drawImage(glow(col), g.x - s / 2, g.y - s / 2, s, s);
    }
    ctx.globalCompositeOperation = 'source-over';

    for (const e of enemies) if (e.x > L - 60 && e.x < Rr + 60 && e.y > T - 60 && e.y < B + 60) drawEnemy(e);

    // bıçaklar
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bladePos) {
      ctx.drawImage(glow('#4de1ff'), b.x - 22, b.y - 22, 44, 44);
      ctx.fillStyle = '#fff'; circle(b.x, b.y, 7);
    }
    // mermiler
    ctx.lineCap = 'round';
    for (const b of bullets) {
      ctx.strokeStyle = 'rgba(120,230,255,.9)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.035, b.y - b.vy * 0.035); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.drawImage(glow('#7be9ff'), b.x - 12, b.y - 12, 24, 24);
    }
    // şimşek
    for (const b of bolts) {
      ctx.globalAlpha = Math.min(1, b.t / 0.18);
      ctx.strokeStyle = 'rgba(120,200,255,.6)'; ctx.lineWidth = 12; ctx.beginPath();
      b.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath();
      b.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';

    // oyuncu
    const blink = player.inv > 0 && Math.floor(t * 20) % 2 === 0;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glow('#37e6ff'), player.x - 40, player.y - 40, 80, 80);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(player.x, player.y + 11, 13, 5, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = blink ? '#ff8fa3' : '#ffffff'; circle(player.x, player.y, 13);
    ctx.fillStyle = '#37e6ff'; circle(player.x, player.y, 8);
    ctx.fillStyle = '#fff'; circle(player.x + player.vx * 0.02, player.y + player.vy * 0.02 - 1, 3.5);
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(player.x - 24, player.y + 20, 48, 6);
    ctx.fillStyle = player.hp / player.maxHp > 0.35 ? '#6cff8f' : '#ff5d73';
    ctx.fillRect(player.x - 24, player.y + 20, 48 * Math.max(0, player.hp / player.maxHp), 6);

    // parçacıklar
    for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life * 3); ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.s, p.s); }
    ctx.globalAlpha = 1;
    ctx.restore();

    // vinyet ve hasar parlaması
    ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
    if (flash > 0) { ctx.fillStyle = `rgba(255,40,70,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }

    // joystick (sabit, sağ alt)
    if (!DEMO && state !== 'over') {
      const b = joyBase();
      let kx = b.x, ky = b.y;
      if (joy.id !== null) { const dx = joy.px - b.x, dy = joy.py - b.y, d = Math.hypot(dx, dy) || 1, m = Math.min(d, b.r); kx += dx / d * m; ky += dy / d * m; }
      ctx.fillStyle = 'rgba(255,255,255,.08)'; circle(b.x, b.y, b.r);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = joy.id !== null ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.3)'; circle(kx, ky, b.r * 0.42);
    }
  }

  function updateHud() {
    xpFill.style.width = Math.min(100, xp / need * 100) + '%';
    lvlEl.textContent = 'Lv ' + level;
    killsEl.textContent = '💀 ' + kills;
    const s = Math.floor(t);
    if (s !== lastSec) { lastSec = s; timeEl.textContent = fmt(t); }
  }

  let last = performance.now();
  function frame(ts) {
    const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
    if (state === 'play') update(dt);
    else if (state === 'ready') { cx = 0; cy = 0; }
    else if (state === 'over') { for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; } parts = parts.filter(p => p.life > 0); shake *= Math.pow(0.02, dt); flash = Math.max(0, flash - dt); }
    draw(); updateHud();
    requestAnimationFrame(frame);
  }

  reset();
  if (DEMO) { titleEl.classList.add('hidden'); state = 'play'; }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
